steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_IMAGE_PATH}'
      - '--file'
      - '${_SERVICE_DIR}/Dockerfile'
      - '${_SERVICE_DIR}'
    id: 'Build'

  # 2. Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE_PATH}']
    id: 'Push'

  # 3. Deploy the container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_AGENT_NAME}'
      - '--image'
      - '${_IMAGE_PATH}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      # This line uses all the individual substitution variables
      - '--set-env-vars'
      - '^--^COMMON_GOOGLE_CLOUD_PROJECT=${_COMMON_GOOGLE_CLOUD_PROJECT}--COMMON_GOOGLE_CLOUD_LOCATION=${_COMMON_GOOGLE_CLOUD_LOCATION}--COMMON_SPANNER_INSTANCE_ID=${_COMMON_SPANNER_INSTANCE_ID}--COMMON_SPANNER_DATABASE_ID=${_COMMON_SPANNER_DATABASE_ID}--UNIFIED_AGENT_GATEWAY_URL=${_UNIFIED_AGENT_GATEWAY_URL}--GENAI_TOOLBOX_URL=${_GENAI_TOOLBOX_URL}--TOOLS_INSTAVIBE_BASE_URL=${_TOOLS_INSTAVIBE_BASE_URL}'
    id: 'Deploy'

# This section defines all the placeholders that the script can provide.
substitutions:
  _IMAGE_PATH: 'us-central1-docker.pkg.dev/your-project/your-repo/your-image:latest'
  _AGENT_NAME: 'default-service-name'
  _SERVICE_DIR: '.'
  _REGION: 'us-central1'
  # Default empty values for all potential environment variables
  _COMMON_GOOGLE_CLOUD_PROJECT: ''
  _COMMON_GOOGLE_CLOUD_LOCATION: ''
  _COMMON_SPANNER_INSTANCE_ID: ''
  _COMMON_SPANNER_DATABASE_ID: ''
  _UNIFIED_AGENT_GATEWAY_URL: ''
  _GENAI_TOOLBOX_URL: ''
  _TOOLS_INSTAVIBE_BASE_URL: ''

images:
  - '${_IMAGE_PATH}'

timeout: '1200s'
