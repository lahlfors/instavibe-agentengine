steps:
  # 1. Build the container image using a Dockerfile in the specified directory
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_IMAGE_PATH}'
      - '--file'
      - '${_SERVICE_DIR}/Dockerfile'
      - '${_SERVICE_DIR}'
    id: 'Build'

  # 2. Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE_PATH}']
    id: 'Push'

  # 3. Deploy the container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_AGENT_NAME}'
      - '--image'
      - '${_IMAGE_PATH}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      # This line correctly uses the single _ENV_VARS variable
      - '--set-env-vars=${_ENV_VARS}'
    id: 'Deploy'

# Define the substitution variables that this build expects
substitutions:
  _IMAGE_PATH: 'us-central1-docker.pkg.dev/your-project/your-repo/your-image:latest'
  _AGENT_NAME: 'default-service-name'
  _SERVICE_DIR: '.'
  _REGION: 'us-central1'
  _ENV_VARS: '' # An empty default for the environment variables

images:
  - '${_IMAGE_PATH}'

timeout: '1200s'
