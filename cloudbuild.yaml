# A reusable and authoritative cloudbuild.yaml for deploying services to Cloud Run.

# Define all the substitution variables that this build expects.
# Providing default empty values makes them optional.
substitutions:
  _IMAGE_PATH: 'us-central1-docker.pkg.dev/your-project/your-repo/your-image:latest'
  _AGENT_NAME: 'your-service-name'
  _SERVICE_DIR: '.'
  _REGION: 'us-central1'
  # This single variable will hold the comma-separated list of environment variables.
  _ENV_VARS: ''
  # Add specific substitutions for the genai-toolbox service
  _COMMON_GOOGLE_CLOUD_PROJECT: ''
  _COMMON_SPANNER_INSTANCE_ID: ''
  _COMMON_SPANNER_DATABASE_ID: ''
  _TOOLS_INSTAVIBE_BASE_URL: ''

steps:
  # 1. Build the container image from the specified service directory.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build'
    args:
      - 'build'
      - '--tag'
      - '${_IMAGE_PATH}'
      # Use the unique build ID as a cache-busting mechanism.
      - '--build-arg'
      - 'CACHEBUSTER=${BUILD_ID}'
      - '.'
    dir: '${_SERVICE_DIR}'

  # 2. Push the container image to Artifact Registry.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push'
    args: ['push', '${_IMAGE_PATH}']
    # This step depends on the build step completing successfully.
    wait_for: ['Build']

  # 3. Deploy the just-pushed image to Cloud Run.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # If _ENV_VARS is provided, use it directly.
        # Otherwise, construct it from the specific variables for the toolbox.
        if [ -n "${_ENV_VARS}" ]; then
          FINAL_ENV_VARS="${_ENV_VARS}"
        else
          FINAL_ENV_VARS="COMMON_GOOGLE_CLOUD_PROJECT=${_COMMON_GOOGLE_CLOUD_PROJECT},COMMON_SPANNER_INSTANCE_ID=${_COMMON_SPANNER_INSTANCE_ID},COMMON_SPANNER_DATABASE_ID=${_COMMON_SPANNER_DATABASE_ID},TOOLS_INSTAVIBE_BASE_URL=${_TOOLS_INSTAVIBE_BASE_URL}"
        fi
        gcloud run deploy "${_AGENT_NAME}" \
          --image "${_IMAGE_PATH}" \
          --region "${_REGION}" \
          --platform "managed" \
          --project "${PROJECT_ID}" \
          --allow-unauthenticated \
          --set-env-vars "$${FINAL_ENV_VARS}"
    # This step depends on the push step completing successfully.
    wait_for: ['Push']

# Tell Cloud Build to expect this image as an output of the build.
images:
  - '${_IMAGE_PATH}'
