steps:
  # 1. Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_IMAGE_PATH}'
      - '--build-arg'
      - 'SERVICE_DIR=${_SERVICE_DIR}'
      - '.'
    id: 'Build'

  # 2. Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE_PATH}']
    id: 'Push'

  # 3. Deploy the container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_AGENT_NAME}'
      - '--image'
      - '${_IMAGE_PATH}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      # This is the key line that uses the bundled variable
      - '--set-env-vars=${_ENV_VARS}'
    id: 'Deploy'

# Define the substitution variables that this build expects.
substitutions:
  _IMAGE_PATH: 'us-central1-docker.pkg.dev/your-project/your-repo/your-image:latest'
  _AGENT_NAME: 'default-service-name'
  _SERVICE_DIR: '.'
  _REGION: 'us-central1'
  _ENV_VARS: '' # An empty default is good practice

# Define the image to be created
images:
  - '${_IMAGE_PATH}'

# Set a timeout for the build
timeout: '1200s'
