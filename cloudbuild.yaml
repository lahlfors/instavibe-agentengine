# A reusable and authoritative cloudbuild.yaml for deploying services to Cloud Run.

steps:
  # 1. Build the container image from the specified service directory.
  # 1a. Copy shared dependencies into the service directory to be included in the build context.
  # We use bash -c '...' to handle cases where directories might not exist.
  - name: 'ubuntu'
    id: 'Pre-build-copy-shared-dirs'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        if [ -d "common" ] && [ "${_SERVICE_DIR}" != "." ]; then cp -r common "${_SERVICE_DIR}"; fi
        if [ -d "agents" ] && [ "${_SERVICE_DIR}" != "." ]; then cp -r agents "${_SERVICE_DIR}"; fi

  # 2. Build the container image from the specified service directory.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build'
    dir: '${_SERVICE_DIR}' # Change working directory for the build step
    args:
      - 'build'
      - '--no-cache'
      - '--tag'
      - '${_IMAGE_PATH}'
      - '.' # Build context is the current directory (now _SERVICE_DIR)
    wait_for: ['Pre-build-copy-shared-dirs']

  # 3. Push the container image to Artifact Registry.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push'
    args: ['push', '${_IMAGE_PATH}']
    wait_for: ['Build']

  # 3. Deploy the just-pushed image to Cloud Run.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image'
      - '${_IMAGE_PATH}'
      - '--region'
      - '${_REGION}'
      - '--platform'
      - 'managed'
      - '--project'
      - '${PROJECT_ID}'
      - '--service-account=${_SERVICE_ACCOUNT}'
      # Set environment variables. Pass empty strings for variables that are not set.
      - '--set-env-vars'
      - 'COMMON_GOOGLE_CLOUD_PROJECT=${_COMMON_GOOGLE_CLOUD_PROJECT}'
      - '--set-env-vars'
      - 'COMMON_GOOGLE_CLOUD_LOCATION=${_COMMON_GOOGLE_CLOUD_LOCATION}'
      - '--set-env-vars'
      - 'COMMON_SPANNER_INSTANCE_ID=${_COMMON_SPANNER_INSTANCE_ID}'
      - '--set-env-vars'
      - 'COMMON_SPANNER_DATABASE_ID=${_COMMON_SPANNER_DATABASE_ID}'
      - '--set-env-vars'
      - 'ORCHESTRATE_AGENT_URL=${_ORCHESTRATE_AGENT_URL}'
      - '--set-env-vars'
      - 'AGENTS_PLATFORM_MCP_CLIENT_MCP_SERVER_URL=${_AGENTS_PLATFORM_MCP_CLIENT_MCP_SERVER_URL}'
      - '--set-env-vars'
      - 'SOCIAL_AGENT_URL=${_SOCIAL_AGENT_URL}'
      - '--set-env-vars'
      - 'SOCIAL_AGENT_RESOURCE_NAME=${_SOCIAL_AGENT_RESOURCE_NAME}'
      - '--set-env-vars'
      - 'PLANNER_AGENT_URL=${_PLANNER_AGENT_URL}'
      - '--set-env-vars'
      - 'MCP_AGENT_URL=${_MCP_AGENT_URL}'
      - '--set-env-vars'
      - 'INSTAVIBE_GOOGLE_MAPS_API_KEY=${_INSTAVIBE_GOOGLE_MAPS_API_KEY}'
      - '--set-env-vars'
      - 'OTEL_COLLECTOR_ENDPOINT=${_OTEL_COLLECTOR_ENDPOINT}'
      - '--set-env-vars'
      - 'ENABLE_TRACING=${_ENABLE_TRACING}'
      - '--set-env-vars'
      - 'COMMON_GEMINI_MODEL=${_COMMON_GEMINI_MODEL}'
      - '--set-env-vars'
      - 'ORCHESTRATE_AGENT_RESOURCE_NAME=${_ORCHESTRATE_AGENT_RESOURCE_NAME}'
      - '--set-env-vars'
      - 'PLANNER_AGENT_RESOURCE_NAME=${_PLANNER_AGENT_RESOURCE_NAME}'
      - '--set-env-vars'
      - 'PLATFORM_MCP_CLIENT_AGENT_RESOURCE_NAME=${_PLATFORM_MCP_CLIENT_AGENT_RESOURCE_NAME}'
      - '--allow-unauthenticated'
    wait_for: ['Push']

# This section defines all placeholders the script can provide.
# Providing default empty values makes them optional.
substitutions:
  _IMAGE_PATH: 'us-central1-docker.pkg.dev/your-project/your-repo/your-image:latest'
  _SERVICE_NAME: 'default-service-name'
  _SERVICE_DIR: '.'
  _REGION: 'us-central1'
  _SERVICE_ACCOUNT: ''

  # Default empty values for ALL potential environment variables across ALL services
  _COMMON_GOOGLE_CLOUD_PROJECT: ''
  _COMMON_GOOGLE_CLOUD_LOCATION: ''
  _COMMON_SPANNER_INSTANCE_ID: ''
  _COMMON_SPANNER_DATABASE_ID: ''
  _ORCHESTRATE_AGENT_URL: ''
  _AGENTS_PLATFORM_MCP_CLIENT_MCP_SERVER_URL: ''
  _SOCIAL_AGENT_URL: ''
  _PLANNER_AGENT_URL: ''
  _MCP_AGENT_URL: ''
  _INSTAVIBE_GOOGLE_MAPS_API_KEY: ''
  _OTEL_COLLECTOR_ENDPOINT: ''
  _ENABLE_TRACING: 'True'
  _COMMON_GEMINI_MODEL: 'gemini-2.5-flash'
  _ORCHESTRATE_AGENT_RESOURCE_NAME: ''
  _PLANNER_AGENT_RESOURCE_NAME: ''
  _SOCIAL_AGENT_RESOURCE_NAME: ''
  _PLATFORM_MCP_CLIENT_AGENT_RESOURCE_NAME: ''

images:
  - '${_IMAGE_PATH}'
