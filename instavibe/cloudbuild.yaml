substitutions:
  # _A2A_WHL_FILE is no longer used as the agents source is copied directly.
  _IMAGE_TAG: 'gcr.io/default-project/default-image:latest' # Default value, will be overridden

steps:
- name: 'gcr.io/cloud-builders/docker'
  args: [
    'build',
    '--no-cache',
    # '--build-arg', 'A2A_WHL_FILE=${_A2A_WHL_FILE}', # Removed
    '-t', '${_IMAGE_TAG}',
    '.'  # Docker build context is the current directory (instavibe/)
  ]
  # The '.' above assumes that when `gcloud builds submit instavibe --config instavibe/cloudbuild.yaml` is run,
  # the working directory for this step within Cloud Build is the 'instavibe' directory itself.

images:
- '${_IMAGE_TAG}'
