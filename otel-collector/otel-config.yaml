receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:8080
      http:
        endpoint: 0.0.0.0:4318


processors:
  batch:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20
  resource:
    attributes:
    - key: environment
      value: "production"
      action: upsert

exporters:
  googlecloud:
    project: "${GOOGLE_CLOUD_PROJECT}"
    trace:
      endpoint: "dns:///cloudtrace.googleapis.com:443"
    metric:
      service_resource_labels: false
    log:
      default_log_name: "instavibe-logs"
  debug:
    verbosity: detailed

service:
  extensions: []
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, memory_limiter, resource]
      exporters: [googlecloud, debug]
    metrics:
      receivers: [otlp]
      processors: [batch, memory_limiter, resource]
      exporters: [googlecloud, debug]
    logs:
      receivers: [otlp]
      processors: [batch, memory_limiter, resource]
      exporters: [googlecloud, debug]
  telemetry:
    logs:
      level: "info"
